name: Test Python setup with allow-prereleases
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          python-version: "3.13"
          allow-prereleases: "true"
      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "python-version: $PY_VERSION"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          if echo "$PY_VERSION" | grep -qE "^3\.13"; then
            echo "PASS: python-version is '$PY_VERSION'"
          else
            echo "FAIL: expected 3.13.x (possibly prerelease) but got: $PY_VERSION"
            exit 1
          fi
      - name: Assert python-path output is set
        env:
          PY_PATH: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "python-path: $PY_PATH"
          if [ -z "$PY_PATH" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          echo "PASS: python-path is '$PY_PATH'"
      - name: Assert python 3.13 is active
        run: |
          PY_VER=$(python3 --version 2>&1 || python --version 2>&1)
          echo "Detected: $PY_VER"
          if echo "$PY_VER" | grep -q "3\.13"; then
            echo "PASS: Python 3.13 is active"
          else
            echo "FAIL: Expected Python 3.13 but got: $PY_VER"
            exit 1
          fi
