name: Test Python setup with allow-prereleases
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          python-version: "3.13"
          allow-prereleases: true
      - name: Assert python-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "actual python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE "^3\.13"; then
            echo "FAIL: expected a 3.13.x version but got $ACTUAL"
            exit 1
          fi
          echo "PASS: python-version resolved to $ACTUAL"
      - name: Assert python-path output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "actual python-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: python executable not found at $ACTUAL"
            exit 1
          fi
          echo "PASS: python-path is $ACTUAL"
      - name: Assert Python 3.13 is on PATH
        run: |
          PYVER=$(python --version 2>&1)
          echo "Got: $PYVER"
          if ! echo "$PYVER" | grep -qE "^Python 3\.13"; then
            echo "FAIL: expected Python 3.13 but got $PYVER"
            exit 1
          fi
          echo "PASS: Python 3.13 is on PATH: $PYVER"
