name: Test python-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version-file: tests/fixtures/python-version-file/.python-version
      - name: Assert version from file was installed
        env:
          ACTUAL: ${{ steps.action.outputs.python-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            3.11.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.11.x"; exit 1 ;;
          esac
          V="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "python on PATH: $V"
          if [ "$V" != "3.11" ]; then
            echo "FAIL: expected 3.11 on PATH"
            exit 1
          fi
          echo "PASS"
