name: Test Python setup with update-environment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          python-version: "3.10"
          update-environment: "false"
      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "python-version: $PY_VERSION"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          if echo "$PY_VERSION" | grep -qE "^3\.10"; then
            echo "PASS: python-version is '$PY_VERSION'"
          else
            echo "FAIL: expected 3.10.x but got: $PY_VERSION"
            exit 1
          fi
      - name: Assert python-path output is set and points to a real file
        env:
          PY_PATH: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "python-path: $PY_PATH"
          if [ -z "$PY_PATH" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          if [ ! -f "$PY_PATH" ]; then
            echo "FAIL: python-path '$PY_PATH' does not point to an existing file"
            exit 1
          fi
          echo "PASS: python-path '$PY_PATH' exists"
      - name: Assert python-path binary runs correctly
        env:
          PY_PATH: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "Running: $PY_PATH --version"
          "$PY_PATH" --version
          echo "PASS: python binary at python-path is executable"
