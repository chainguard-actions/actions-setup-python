name: Test Python setup with update-environment false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          python-version: "3.10"
          update-environment: "false"
      - name: Assert python-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE "^3\.10"; then
            echo "FAIL: expected Python 3.10.x but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: python-version=$ACTUAL"
      - name: Assert python-path output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "python-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          # The path should point to a real Python binary
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: python-path does not point to an existing file: $ACTUAL"
            exit 1
          fi
          echo "PASS: python-path=$ACTUAL"
      - name: Assert python-path binary works
        env:
          PYTHON_PATH: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "Testing binary at: $PYTHON_PATH"
          VER=$("$PYTHON_PATH" --version 2>&1)
          echo "version: $VER"
          if ! echo "$VER" | grep -qE "^Python 3\.10"; then
            echo "FAIL: expected Python 3.10 but got: $VER"
            exit 1
          fi
          echo "PASS"
