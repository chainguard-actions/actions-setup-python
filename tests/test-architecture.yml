name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-python
        uses: .
        with:
          python-version: "3.12"
          architecture: x64
      - name: Assert python-version output is set
        env:
          PYTHON_VERSION: ${{ steps.setup-python.outputs.python-version }}
        run: |
          echo "python-version: $PYTHON_VERSION"
          if [ -z "$PYTHON_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version=$PYTHON_VERSION"
      - name: Assert Python is on PATH and is x64
        run: |
          python --version
          ARCH=$(python -c "import platform; print(platform.machine())")
          echo "architecture: $ARCH"
          if [ "$ARCH" != "x86_64" ]; then
            echo "FAIL: expected x86_64 architecture, got $ARCH"
            exit 1
          fi
          echo "PASS: architecture is x86_64 (x64)"
