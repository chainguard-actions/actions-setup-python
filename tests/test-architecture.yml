name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.action.outputs.python-version }}
        run: |
          echo "python-version: $PY_VERSION"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert python-path output is set
        env:
          PY_PATH: ${{ steps.action.outputs.python-path }}
        run: |
          echo "python-path: $PY_PATH"
          if [ -z "$PY_PATH" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert Python is on PATH and is x64
        run: |
          python --version
          python -c "import platform; arch = platform.machine(); print('arch:', arch); assert arch in ('x86_64', 'AMD64'), 'Expected x64 architecture, got: ' + arch"
          echo "PASS: python is on PATH with x64 architecture"
