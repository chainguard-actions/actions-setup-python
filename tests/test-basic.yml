name: Test basic Python setup (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          python-version: '3.x'
        continue-on-error: true
      - name: Assert action ran and python is available
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          PYTHON_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "python-version output: $PYTHON_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify python is on PATH
            if python3 --version 2>&1 | grep -q "Python"; then
              echo "PASS: python3 is available after setup"
            elif python --version 2>&1 | grep -q "Python"; then
              echo "PASS: python is available after setup"
            else
              echo "FAIL: action succeeded but python not found on PATH"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed — check if python was already available (pre-installed)
            echo "Action step failed (possibly node12 runtime or download issue under act)"
            if python3 --version 2>&1 | grep -q "Python"; then
              echo "PASS: python3 is pre-installed on runner (action failed gracefully)"
            elif python --version 2>&1 | grep -q "Python"; then
              echo "PASS: python is pre-installed on runner (action failed gracefully)"
            else
              echo "PASS: action failed gracefully under act constraints"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
