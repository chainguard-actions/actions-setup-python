name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.12"
      - name: Assert python-version output
        env:
          ACTUAL: ${{ steps.action.outputs.python-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            3.12.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.12.x"; exit 1 ;;
          esac
      - name: Assert python-path output is executable
        env:
          PY_PATH: ${{ steps.action.outputs.python-path }}
        run: |
          echo "python-path: $PY_PATH"
          if [ -z "$PY_PATH" ] || [ ! -x "$PY_PATH" ]; then
            echo "FAIL: python-path missing or not executable"
            exit 1
          fi
          "$PY_PATH" --version
          echo "PASS"
      - name: Assert python on PATH is the installed version
        run: |
          V="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "python on PATH: $V"
          if [ "$V" != "3.12" ]; then
            echo "FAIL: expected 3.12 on PATH"
            exit 1
          fi
          if [ -z "$pythonLocation" ]; then
            echo "FAIL: pythonLocation env not set"
            exit 1
          fi
          echo "PASS"
