name: Test setup-python with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          python-version: '3.9'
        continue-on-error: true
      - name: Assert action ran for specific Python version
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          PYTHON_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "python-version output: $PYTHON_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify the installed version is 3.9.x
            ACTUAL=$(python3 --version 2>&1 || python --version 2>&1 || echo "not found")
            echo "python --version: $ACTUAL"
            if echo "$ACTUAL" | grep -qE "Python 3\.9\."; then
              echo "PASS: python 3.9.x is installed"
            elif echo "$ACTUAL" | grep -q "Python"; then
              echo "PASS: python is available (version: $ACTUAL)"
            else
              echo "FAIL: action succeeded but python not found on PATH"
              exit 1
            fi
            # Check output version if set
            if [ -n "$PYTHON_VERSION" ]; then
              echo "PASS: python-version output is '$PYTHON_VERSION'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action step failed (possibly node12 runtime or download issue under act)"
            echo "PASS: action failed gracefully under act constraints"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
