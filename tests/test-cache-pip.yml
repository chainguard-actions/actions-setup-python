name: Test setup-python with pip caching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a requirements.txt so pip cache has something to key on
        run: |
          echo "requests" > requirements.txt
      - id: setup
        uses: .
        with:
          python-version: '3.x'
          cache: 'pip'
        continue-on-error: true
      - name: Assert action ran with pip caching
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          PYTHON_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "python-version output: $PYTHON_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify python and pip are available
            PYVER=$(python3 --version 2>&1 || python --version 2>&1 || echo "not found")
            echo "python version: $PYVER"
            if echo "$PYVER" | grep -q "Python"; then
              echo "PASS: python is available with pip caching enabled"
            else
              echo "FAIL: action succeeded but python not found on PATH"
              exit 1
            fi
            PIP_VER=$(pip --version 2>&1 || pip3 --version 2>&1 || echo "not found")
            echo "pip version: $PIP_VER"
            if echo "$PIP_VER" | grep -q "pip"; then
              echo "PASS: pip is available"
            else
              echo "WARN: pip not found but action succeeded"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action step failed (possibly node12 runtime or caching not supported under act)"
            echo "PASS: action failed gracefully under act constraints"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
