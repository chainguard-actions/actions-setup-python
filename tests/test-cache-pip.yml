name: Test pip cache with cache-dependency-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/fixtures/requirements.txt
      - name: Assert python-version output
        env:
          ACTUAL: ${{ steps.action.outputs.python-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            3.12.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.12.x"; exit 1 ;;
          esac
      - name: Assert cache-hit output is a boolean (or unset if cache service unavailable)
        env:
          HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: '$HIT'"
          case "$HIT" in
            true|false|"") echo "PASS" ;;
            *) echo "FAIL: unexpected cache-hit value"; exit 1 ;;
          esac
