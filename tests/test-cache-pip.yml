name: Test Python setup with pip cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements.txt for cache key
        run: |
          echo "requests==2.28.0" > requirements.txt
      - id: setup
        uses: .
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Assert python-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version=$ACTUAL"
      - name: Assert cache-hit output is set (true or false)
        env:
          ACTUAL: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit: $ACTUAL"
          # cache-hit should be either 'true' or 'false' (or empty on first run)
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ] && [ -n "$ACTUAL" ]; then
            echo "FAIL: cache-hit should be 'true' or 'false', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: cache-hit=$ACTUAL"
      - name: Assert Python is functional
        run: |
          python3 -c "import sys; print('Python', sys.version)"
          echo "PASS"
