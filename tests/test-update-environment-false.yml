name: Test Python setup with update-environment false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          python-version: "3.11"
          update-environment: false
      - name: Assert python-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "actual python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version output is set to $ACTUAL"
      - name: Assert python-path output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "actual python-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          # The python executable should exist at the reported path
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: python executable not found at $ACTUAL"
            exit 1
          fi
          echo "PASS: python-path points to a valid executable at $ACTUAL"
      - name: Assert python executable is usable via python-path
        env:
          PYTHON_PATH: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "Running python via python-path output: $PYTHON_PATH"
          PYVER=$("$PYTHON_PATH" --version 2>&1)
          echo "Got: $PYVER"
          if ! echo "$PYVER" | grep -q "3.11"; then
            echo "FAIL: expected Python 3.11 but got $PYVER"
            exit 1
          fi
          echo "PASS: Python 3.11 is accessible via python-path"
