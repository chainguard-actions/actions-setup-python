name: Test pip-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python-version: "3.11"
          pip-version: "24.0"
      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.action.outputs.python-version }}
        run: |
          echo "python-version: $PY_VERSION"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert pip version matches requested
        run: |
          ACTUAL=$(pip --version 2>&1)
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "24.0"; then
            echo "FAIL: expected pip 24.0, got $ACTUAL"
            exit 1
          fi
          echo "PASS"
