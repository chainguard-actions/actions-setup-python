name: Test Python setup with pip-install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-python
        uses: .
        with:
          python-version: '3.11'
          pip-install: 'requests'
      - name: Assert python-version output is set
        env:
          ACTUAL: ${{ steps.setup-python.outputs.python-version }}
        run: |
          echo "actual python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version output is set to $ACTUAL"
      - name: Assert requests package is installed
        run: |
          echo "Checking if requests is installed..."
          if ! python -c "import requests; print('requests version:', requests.__version__)"; then
            echo "FAIL: requests package is not installed"
            exit 1
          fi
          echo "PASS: requests package is installed"
