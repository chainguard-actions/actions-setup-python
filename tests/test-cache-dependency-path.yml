name: Test cache-dependency-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements file for cache dependency
        run: |
          echo "requests==2.31.0" > /tmp/requirements-test.txt
      - id: action
        uses: .
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: /tmp/requirements-test.txt
      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.action.outputs.python-version }}
          PY_PATH: ${{ steps.action.outputs.python-path }}
        run: |
          echo "python-version: $PY_VERSION"
          echo "python-path: $PY_PATH"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          if [ -z "$PY_PATH" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert python is available
        run: |
          python --version
          pip --version
          echo "PASS"
