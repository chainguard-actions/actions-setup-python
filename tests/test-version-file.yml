name: Test Python setup from version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .python-version file
        run: |
          echo "3.10" > .python-version
      - id: setup-python
        uses: .
        with:
          python-version-file: '.python-version'
      - name: Assert python-version output is set
        env:
          ACTUAL: ${{ steps.setup-python.outputs.python-version }}
        run: |
          echo "actual python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version output is set to $ACTUAL"
      - name: Assert python-path output is set
        env:
          ACTUAL: ${{ steps.setup-python.outputs.python-path }}
        run: |
          echo "actual python-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: python executable not found at $ACTUAL"
            exit 1
          fi
          echo "PASS: python-path is $ACTUAL"
      - name: Assert Python 3.10 is on PATH
        run: |
          echo "Python version: $(python --version)"
          PYVER=$(python --version 2>&1)
          if ! echo "$PYVER" | grep -q "3.10"; then
            echo "FAIL: expected Python 3.10, got $PYVER"
            exit 1
          fi
          echo "PASS: $PYVER"
