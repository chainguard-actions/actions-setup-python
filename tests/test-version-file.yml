name: Test python-version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create python version file
        run: |
          echo "3.11" > /tmp/test-python-version
      - id: action
        uses: .
        with:
          python-version-file: /tmp/test-python-version
      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.action.outputs.python-version }}
          PY_PATH: ${{ steps.action.outputs.python-path }}
        run: |
          echo "python-version: $PY_VERSION"
          echo "python-path: $PY_PATH"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          if [ -z "$PY_PATH" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert python version matches file
        run: |
          ACTUAL=$(python --version 2>&1)
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "3.11"; then
            echo "FAIL: expected Python 3.11, got $ACTUAL"
            exit 1
          fi
          echo "PASS"
