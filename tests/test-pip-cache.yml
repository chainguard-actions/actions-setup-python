name: Test Python setup with pip cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements.txt for cache key
        run: |
          echo "requests==2.28.0" > "$GITHUB_WORKSPACE/requirements.txt"
      - id: setup
        uses: .
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Assert python-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-version }}
        run: |
          echo "python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version=$ACTUAL"
      - name: Assert python-path output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.python-path }}
        run: |
          echo "python-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-path output is empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: python-path does not point to an existing file: $ACTUAL"
            exit 1
          fi
          echo "PASS: python-path=$ACTUAL"
      - name: Assert cache-hit output is present (true or false)
        env:
          ACTUAL: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit: $ACTUAL"
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ] && [ "$ACTUAL" != "" ]; then
            echo "FAIL: unexpected cache-hit value: $ACTUAL"
            exit 1
          fi
          echo "PASS: cache-hit=$ACTUAL"
