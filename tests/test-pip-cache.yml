name: Test Python setup with pip cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create requirements.txt for cache key
        run: |
          echo "requests==2.28.0" > requirements.txt
      - id: setup-python
        uses: .
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Assert python-version output is set
        env:
          ACTUAL: ${{ steps.setup-python.outputs.python-version }}
        run: |
          echo "actual python-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version output is set to $ACTUAL"
      - name: Assert cache-hit output is present (true or false)
        env:
          ACTUAL: ${{ steps.setup-python.outputs.cache-hit }}
        run: |
          echo "actual cache-hit: $ACTUAL"
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ] && [ "$ACTUAL" != "" ]; then
            echo "FAIL: cache-hit should be 'true', 'false', or empty, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: cache-hit is '$ACTUAL'"
      - name: Assert Python 3.12 is on PATH
        run: |
          echo "Python version: $(python --version)"
          PYVER=$(python --version 2>&1)
          if ! echo "$PYVER" | grep -q "3.12"; then
            echo "FAIL: expected Python 3.12, got $PYVER"
            exit 1
          fi
          echo "PASS: $PYVER"
